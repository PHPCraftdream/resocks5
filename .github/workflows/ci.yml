name: CI

# Segmented CI. A push or PR runs only what its diff needs, on ubuntu only
# (`changes` job, .github/scripts/changed-areas.sh maps the changed files to
# segments and to the SDK / app tests of the touched modules).
# The FULL run — every segment, whole workspace, every OS — is explicit:
#   - `[ci: full]` (or `[full-ci]`) in a commit message of the push/PR, or in
#     the PR title;
#   - Actions -> CI -> Run workflow (`workflow_dispatch`);
#   - a `v*` tag;
#   - a change to this workflow or the classifier script (to prove it).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes (which segments to run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.areas.outputs.full }}
      run_test: ${{ steps.areas.outputs.run_test }}
      run_lint: ${{ steps.areas.outputs.run_lint }}
      run_msrv: ${{ steps.areas.outputs.run_msrv }}
      run_doc: ${{ steps.areas.outputs.run_doc }}
      run_net: ${{ steps.areas.outputs.run_net }}
      net_matrix: ${{ steps.areas.outputs.net_matrix }}
      net_test_args: ${{ steps.areas.outputs.net_test_args }}
      run_clippy_net: ${{ steps.areas.outputs.run_clippy_net }}
      run_doc_net: ${{ steps.areas.outputs.run_doc_net }}
      run_portable: ${{ steps.areas.outputs.run_portable }}
      run_deny: ${{ steps.areas.outputs.run_deny }}
      run_licenses: ${{ steps.areas.outputs.run_licenses }}
      run_installers: ${{ steps.areas.outputs.run_installers }}
      test_os: ${{ steps.areas.outputs.test_os }}
      msrv_os: ${{ steps.areas.outputs.msrv_os }}
      test_scope: ${{ steps.areas.outputs.test_scope }}
      test_filter: ${{ steps.areas.outputs.test_filter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          MARKER: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: sh .github/scripts/changed-areas.sh "$EVENT" "$BASE" "$HEAD_SHA" "$MARKER" >> "$GITHUB_OUTPUT"

  installers:
    name: installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_installers == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Обновление работающего сервера и очистка старых бинарников
        run: python -I -X utf8 .github/scripts/test_installers.py

  # Targeted: ubuntu only, the app's package, and only the app tests of the
  # modules the diff touched (libtest filters). Full: all three OSes, whole
  # workspace, no filter.
  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_test == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build ${{ needs.changes.outputs.test_scope }} --all-targets
      - run: cargo test ${{ needs.changes.outputs.test_scope }} ${{ needs.changes.outputs.test_filter }}

  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.run_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Code-structure rule: at most 1000 lines per Rust file and at most 7 entries
  # per directory. Files and directories that were already over are recorded
  # with their size in the scripts' BASELINE (a ratchet that can only shrink).
  structure:
    name: structure (1000 lines, 7 entries, no doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh .github/scripts/check-line-limit.sh
      - run: sh .github/scripts/check-dir-entries.sh
      - run: sh .github/scripts/check-no-doctests.sh

  # Machine-verifies the `rust-version` declared in the workspace manifest.
  # Runs on ubuntu AND windows because some deps gate code behind cfg(windows)
  # (e.g. rpassword's let-chain backend) — a ubuntu-only check would miss it.
  # `--locked` so a drifted Cargo.lock fails loudly instead of silently
  # resolving versions above the MSRV.
  msrv:
    name: msrv (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_msrv == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.msrv_os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # `resocks5-net` sets `#![warn(missing_docs)]`; this job makes it binding by
  # building rustdoc with `-D warnings`. Also catches broken intra-doc links
  # and `rustdoc::redundant_explicit_links` drift. Same `--locked` discipline.
  doc:
    name: cargo doc
    needs: changes
    if: needs.changes.outputs.run_doc == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace --locked

  # The workspace jobs above never compile resocks5-net with a feature off:
  # the binary enables pool/tls/serde/rating/rotator in [dependencies] (and
  # test-instrumentation in [dev-dependencies] for its test builds), and cargo
  # unifies features across a workspace build. This matrix pins the library's
  # feature combinations directly on `-p resocks5-net`, which cannot see the
  # binary's feature choices.
  #
  # Single-feature builds are the point: a #[cfg] that silently depends on a
  # sibling feature compiles fine both all-on and all-off and breaks only in
  # between — that bug class happened here once (test-instrumentation gated
  # code living inside the rotator module) and only a single-feature build
  # catches it.
  #
  # cargo test (not check/build) per combination: it compiles the same package
  # graph a check would (lib + unit + integration + doctests, plus the
  # required-features-gated example when its feature is on) and then runs the
  # tests, so a separate check step would double compile time for zero added
  # coverage while leaving broken #[cfg(test)] gating invisible.
  #
  # The global RUSTFLAGS=-D warnings applies here too, so feature-off builds
  # must also stay warning-free (dead code / unused imports appear only when
  # a feature is off).
  #
  # ubuntu-only: feature gating is cfg(feature), orthogonal to the OS matrix
  # the `test` job already covers.
  #
  # Hand-maintained on purpose: cargo-hack --feature-powerset over five
  # features is 32 serial runs in one job (its implied-feature pairs like
  # {rotator} == {rating, rotator} do not collapse), and it would add a
  # third-party action (taiki-e/install-action) to the trust base. The cost
  # of this shape: when you add a feature to resocks5-net, add a row to
  # `row_args` and `ALL_ROWS` in .github/scripts/changed-areas.sh (the matrix
  # is generated there so `[ci: net=<row>+<row>]` can run a subset).
  net-features:
    name: net features (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run_net == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.net_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p resocks5-net ${{ matrix.args }} --locked ${{ needs.changes.outputs.net_test_args }}

  # Lean clippy for the library: dead-code and unused-import lints surface
  # only in feature-off builds, and the workspace `lint` job always sees
  # every feature on (unified through the binary). The matrix above already
  # denies rustc warnings via the global RUSTFLAGS; this adds the clippy-only
  # lint set on the lean path.
  clippy-net-lean:
    name: clippy (net, no default features)
    needs: changes
    if: needs.changes.outputs.run_clippy_net == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p resocks5-net --no-default-features --all-targets --locked -- -D warnings
      - run: cargo clippy -p resocks5-net --no-default-features --features pool --all-targets --locked -- -D warnings
      # The lean dependency graph must stay free of the pool's and TLS's crates.
      - name: lean graph has no dashmap/crossbeam/rustls
        run: |
          tree=$(cargo tree -p resocks5-net --no-default-features -e normal --locked)
          echo "$tree"
          if echo "$tree" | grep -E 'dashmap|crossbeam|rustls'; then
            echo "lean graph leaked a gated dependency" >&2
            exit 1
          fi

  # Lean docs for the library: the `doc` job always builds with every feature
  # on, but gated items break intra-doc links exactly when the feature is
  # off. Same RUSTDOCFLAGS=-D warnings discipline as the `doc` job.
  doc-net-lean:
    name: cargo doc (net, no default features)
    needs: changes
    if: needs.changes.outputs.run_doc_net == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p resocks5-net --no-default-features --no-deps --locked
      - run: cargo doc -p resocks5-net --no-default-features --features pool --no-deps --locked

  # The release binaries must run on a bare machine: fully static on Linux
  # (musl, x86_64 + arm64) and a static CRT on Windows (no VC++ Redistributable).
  # Building them here, on every push, catches a toolchain/dependency change
  # that breaks a release target long before a tag does.
  portable-builds:
    name: portable build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.run_portable == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -D warnings -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '-D warnings' }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build -p resocks5 --locked --target ${{ matrix.target }}
      - name: Verify the binary is fully static
        if: matrix.musl
        run: |
          bin="target/${{ matrix.target }}/debug/resocks5"
          ldd "$bin" 2>&1 | grep -qE "not a dynamic executable|statically linked"
      - name: Smoke test (--help)
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/debug/resocks5"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help > /dev/null

  # License / supply-chain policy (deny.toml). `licenses`, `bans` and
  # `sources` gate every push and PR: a dependency under a license outside the
  # allow-list, a banned crate, or a non-crates.io source fails the build.
  # `advisories` runs separately and non-blocking, so a new RUSTSEC entry on
  # an unrelated crate does not block unrelated work; it is still reported.
  deny:
    name: cargo deny (licenses, bans, sources)
    needs: changes
    if: needs.changes.outputs.run_deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
  deny-advisories:
    name: cargo deny (advisories, informational)
    needs: changes
    if: needs.changes.outputs.run_deny == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # The distributed binaries embed third-party code, so their archives must
  # carry the license texts (MIT / Apache-2.0 / ISC … require attribution).
  # This job proves the THIRD-PARTY-LICENSES.txt generation works on every
  # push; release.yml generates the same file into each archive.
  third-party-licenses:
    name: third-party license texts
    needs: changes
    if: needs.changes.outputs.run_licenses == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate THIRD-PARTY-LICENSES.txt
        run: >
          cargo about generate --workspace --all-features --locked --fail
          -c .github/licenses/about.toml
          -o THIRD-PARTY-LICENSES.txt
          .github/licenses/about.hbs
      - name: Sanity-check the output
        run: |
          test -s THIRD-PARTY-LICENSES.txt
          grep -q "tokio" THIRD-PARTY-LICENSES.txt
          grep -q "MIT" THIRD-PARTY-LICENSES.txt

  # The one check to require in branch protection. Segments skipped by
  # `changes` count as passing; a failed or cancelled one fails the gate.
  ci-result:
    name: ci result
    if: always()
    needs:
      - changes
      - installers
      - test
      - lint
      - structure
      - msrv
      - doc
      - net-features
      - clippy-net-lean
      - doc-net-lean
      - portable-builds
      - deny
      - deny-advisories
      - third-party-licenses
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any segment failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "segment results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
