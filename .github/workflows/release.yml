name: release

# Build and publish on every `v*` tag push:
#   - native release binaries for Linux/Windows/macOS (arm64 + x64)
#   - a GitHub Release with the binaries + sha256 checksums
#   - a multi-arch (amd64 + arm64) container image pushed to ghcr.io
#
# `workflow_dispatch` lets a maintainer re-run the pipeline for an existing tag
# (e.g. to republish a botched release) without force-pushing the tag.
#
# The `resocks5` binary is distributed only through the GitHub Release and the
# container image; crates.io carries just the `resocks5-net` SDK.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: nothing here pushes, so the workflow token is read-only;
# the one job that needs `contents: write` (the GitHub Release) declares it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One native build per target. We avoid `cross` / QEMU for the Rust build
  # because the dependency tree pulls in `ring` (hand-written asm + C), which
  # is far more reliable when compiled on a runner whose host matches the
  # target. The two macOS targets are both built on a single arm64 runner —
  # arm64 natively, x86_64 as a same-OS cross (same SDK, just `-target`).
  build:
    name: build (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Static musl builds run on any Linux (glibc or musl/Alpine, any
          # age) with no shared-library dependencies. The ARM64 one is built
          # natively on GitHub's arm64 runner.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            musl: true
          # Static CRT: the exe needs no Visual C++ Redistributable.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            rustflags: -C target-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl toolchain (static Linux builds)
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify the binary is fully static
        if: matrix.musl
        run: |
          bin="target/${{ matrix.target }}/release/resocks5"
          ldd "$bin" 2>&1 | grep -qE "not a dynamic executable|statically linked"
      # Run the freshly built binary once (all legs but the Intel macOS one,
      # which is a cross build on an arm64 runner).
      - name: Smoke test (--help)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/resocks5"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help > /dev/null
      # We stage the binary and the LICENSE files into a single directory and
      # archive from there. Earlier versions used `tar -C target/.../release`,
      # which made the LICENSE paths relative to the target dir (where they
      # don't exist) and would fail the release on the first v* tag. The zip
      # path used absolute-style paths and produced a deeply-nested archive
      # (`target/.../release/resocks5.exe`); the staging dir flattens it too.
      # Attribution: MIT / Apache-2.0 / ISC … dependencies must ship their
      # license texts with the binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate third-party license texts
        shell: bash
        run: >
          cargo about generate --workspace --all-features --locked --fail
          -c .github/licenses/about.toml
          -o THIRD-PARTY-LICENSES.txt
          .github/licenses/about.hbs
      - name: Stage archive contents
        shell: bash
        run: |
          mkdir -p stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/resocks5.exe" stage/
          else
            cp "target/${{ matrix.target }}/release/resocks5" stage/
          fi
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt stage/
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          asset="resocks5-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C stage .
          echo "asset=$asset" >> "$GITHUB_ENV"
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          asset="resocks5-${{ matrix.target }}.zip"
          ( cd stage && 7z a "../$asset" . )
          echo "asset=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: ${{ env.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that writes: creating the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: assets
        run: sha256sum *.tar.gz *.zip > sha256sums.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/sha256sums.txt
          generate_release_notes: true
          # A tag like v0.1.0-rc1 publishes as a prerelease; v0.1.0 as latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  # Publish the resocks5-net SDK crate to crates.io. `version.workspace =
  # true` ties resocks5-net's version to the same tag as the native/Docker
  # release, so a v* push always corresponds to a new (never-before-seen)
  # resocks5-net version — no separate SDK tag or trigger needed.
  #
  # Packaging and the verification build run first, with no secret in the
  # environment — build scripts and proc macros never see the upload token.
  # The upload steps then publish the already verified package with
  # `--no-verify` (nothing is compiled while the token is set). The upload
  # supports two auth modes, picked by the repo VARIABLE `CRATES_IO_AUTH`
  # (Settings → Secrets and variables → Actions → Variables):
  #
  #   unset / anything but "oidc"  →  API token (the default). Upload skips
  #     cleanly (a notice, not a failure) until the CARGO_REGISTRY_TOKEN
  #     secret exists: an API token from https://crates.io/settings/tokens
  #     scoped to publish-new + publish-update. Needed for the FIRST
  #     release — a crate must exist on crates.io before a trusted
  #     publisher can be configured for it.
  #   "oidc"  →  crates.io Trusted Publishing: no stored secret, the job
  #     exchanges its GitHub OIDC identity for a short-lived token. One-time
  #     setup on crates.io (crate settings → Trusted Publishing): repository
  #     PHPCraftdream/resocks5, workflow release.yml. Then set the variable
  #     to "oidc" and delete the CARGO_REGISTRY_TOKEN secret.
  #
  # Only the SDK is published; the `resocks5` binary crate is `publish =
  # false` (binaries ship via the GitHub Release and the container image).
  publish-crates:
    name: publish resocks5-net to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions replace the workflow-level ones: read-only
    # contents, plus the OIDC identity token for the trusted-publishing
    # exchange (unused in token mode).
    permissions:
      contents: read
      id-token: write
    # `secrets` isn't readable from an `if:` condition directly (GitHub
    # Actions restriction) — mirror it into `env` once at job level, where
    # `secrets` access is allowed, then branch on the `env` context instead.
    env:
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache: a once-per-release job has nothing to reuse, and no
      # build state should carry into the token-bearing steps.
      - name: Package and verify (no secrets in the environment)
        run: cargo package -p resocks5-net --locked
      - name: Check the produced .crate
        run: |
          crate=$(ls target/package/resocks5-net-*.crate)
          echo "verifying $crate"
          test -f "$crate"
          tar -tzf "$crate" | grep -F 'Cargo.toml.orig'
          tar -tzf "$crate" | grep -F 'src/lib.rs'
          tar -tzf "$crate" | grep -F 'README.md'
      - name: Publish (API token)
        if: ${{ vars.CRATES_IO_AUTH != 'oidc' && env.HAS_CARGO_REGISTRY_TOKEN == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p resocks5-net --no-verify --locked
      - name: Upload skipped (no credentials configured)
        if: ${{ vars.CRATES_IO_AUTH != 'oidc' && env.HAS_CARGO_REGISTRY_TOKEN != 'true' }}
        run: echo "::notice::crates.io upload skipped - add the CARGO_REGISTRY_TOKEN secret, or set the CRATES_IO_AUTH variable to 'oidc' once a trusted publisher is configured."
      - name: Authenticate to crates.io (trusted publishing)
        id: crates-io-auth
        if: ${{ vars.CRATES_IO_AUTH == 'oidc' }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish (trusted publishing)
        if: ${{ vars.CRATES_IO_AUTH == 'oidc' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish -p resocks5-net --no-verify --locked

  # Multi-arch container image → ghcr.io/<owner>/resocks5.
  # Built with Buildx + QEMU so a single ubuntu runner emits both linux/amd64
  # and linux/arm64 manifests. `metadata-action` lowercases the repo name
  # (ghcr.io requires all-lowercase) and derives semver tags from the git tag.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
