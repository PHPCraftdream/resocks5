name: release

# Build and publish on every `v*` tag push:
#   - native release binaries for Linux/Windows/macOS (arm64 + x64)
#   - a GitHub Release with the binaries + sha256 checksums
#   - a multi-arch (amd64 + arm64) container image pushed to ghcr.io
#
# `workflow_dispatch` lets a maintainer re-run the pipeline for an existing tag
# (e.g. to republish a botched release) without force-pushing the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One native build per target. We avoid `cross` / QEMU for the Rust build
  # because the dependency tree pulls in `ring` (hand-written asm + C), which
  # is far more reliable when compiled on a runner whose host matches the
  # target. The two macOS targets are both built on a single arm64 runner —
  # arm64 natively, x86_64 as a same-OS cross (same SDK, just `-target`).
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          asset="resocks5-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" \
            -C "target/${{ matrix.target }}/release" resocks5 \
            LICENSE-MIT LICENSE-APACHE
          echo "asset=$asset" >> "$GITHUB_ENV"
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          asset="resocks5-${{ matrix.target }}.zip"
          7z a "$asset" \
            "./target/${{ matrix.target }}/release/resocks5.exe" \
            LICENSE-MIT LICENSE-APACHE
          echo "asset=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: ${{ env.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: assets
        run: sha256sum *.tar.gz *.zip > sha256sums.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/sha256sums.txt
          generate_release_notes: true
          # A tag like v0.1.0-rc1 publishes as a prerelease; v0.1.0 as latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  # Multi-arch container image → ghcr.io/<owner>/resocks5.
  # Built with Buildx + QEMU so a single ubuntu runner emits both linux/amd64
  # and linux/arm64 manifests. `metadata-action` lowercases the repo name
  # (ghcr.io requires all-lowercase) and derives semver tags from the git tag.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
