[workspace]
resolver = "2"
members = ["crates/resocks5-net", "crates/resocks5"]

# Compile fixtures with their own deliberately separate workspace; see
# tests/feature_unification/README.md.
exclude = ["tests/feature_unification"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Verified against the `msrv` job in .github/workflows/ci.yml (runs on
# ubuntu + windows with `--locked`). Two constraints bind the floor:
#   - edition 2024 in transitive deps (`zeroize` via `rustls`/`ring`) → 1.85
#   - `let`-chains in `rpassword`'s Windows backend → 1.88 (the binding one)
# Bumping any dep can raise this without notice; the msrv job catches it.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PHPCraftdream/resocks5"

[workspace.dependencies]
# Shared across both crates — single source of truth for versions.
# Version only — each crate declares the tokio features it actually needs,
# so the library does not force "full" onto downstream consumers.
tokio = { version = "1.43.0", default-features = false }
anyhow = "1.0.95"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
socket2 = "0.5"
# `ring` crypto provider (not the default `aws-lc-rs`) so building needs
# no cmake / C toolchain — pure-Rust-ish build for contributors and CI.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
# >=0.23.45: RUSTSEC-2026-0285 fix (TLS 1.3 handshake messages accepted
# across encryption-level boundaries in older 0.23.x). Floor raised so a
# future `cargo update` cannot resolve back down to a vulnerable patch.
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
dashmap = "6"
crossbeam-queue = "0.3"
# Application-only.
chrono = "0.4"
regex = "1.11.1"
getrandom = "0.2"
sha2 = "0.10"
subtle = "2.6"
argon2 = "0.5"
hmac = "0.12"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
ktav = "0.6.0"

[profile.dev]
opt-level = 0
codegen-units = 14
incremental = true
strip = true

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
incremental = true
strip = true
