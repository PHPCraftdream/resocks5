[package]
name = "resocks5-net"
description = "Reusable proxy networking toolkit: SOCKS5/HTTP/HTTPS upstream connectors, a pre-connect TCP pool, a sand-rating soft-weight rotator with exponential decay, and TLS ClientHello fragmentation."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["socks5", "proxy", "http-connect", "tokio", "networking"]
categories = ["network-programming"]

[dependencies]
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
base64.workspace = true
socket2.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
dashmap.workspace = true
crossbeam-queue.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
