[package]
name = "resocks5-net"
description = "Reusable proxy networking toolkit: SOCKS5/HTTP/HTTPS upstream connectors, a pre-connect TCP pool, a sand-rating soft-weight rotator with exponential decay, and TLS ClientHello fragmentation."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["socks5", "proxy", "http-connect", "tokio", "networking"]
categories = ["network-programming"]

[features]
# TLS upstream support: the HTTPS (TLS-wrapped CONNECT) connector, the
# default Mozilla-root-store `TlsConnector`, and the `AnyUpstream::Tls`
# variant. The `dep:` form keeps the optional crates from leaking
# implicit features into the public feature surface. Builds without it
# stay SOCKS5/HTTP-only; an HTTPS upstream requested then is a runtime
# error naming the missing feature, never a silent plaintext fallback.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
# The pre-connect TCP pool (`pool` module): `ProxyPool`, `PoolConfig`,
# `AtCapacity`, the pool-taking connectors (`connect_proxy`,
# `connect_http_proxy`, `connect_socks5_proxy`, and with `tls` also
# `connect_https_proxy`) and `ConnectError::AtCapacity`. It is the only
# user of `dashmap` and `crossbeam-queue`. Without it `dial`,
# `connect_proxy_once`, the protocol cores, `AnyUpstream`/`UpstreamStream`,
# tunnelling, fragmentation, rating and the rotator remain available.
# Features are additive: items appear when it is on, nothing changes shape.
pool = ["dep:dashmap", "dep:crossbeam-queue"]
# Serde derives on `pool::PoolConfig` — the crate's only serde touchpoint,
# so without `pool` this feature is a no-op (it still compiles).
# The `dep:` form keeps serde from leaking an implicit feature name.
# Builds without it drop serde and its proc-macro compile chain entirely;
# the struct is unchanged apart from the derives (still `Debug`, `Clone`,
# `Default`, and constructible by hand).
serde = ["dep:serde"]
# The sand-rating model (`rating` module): per-upstream exponential-decay
# failure accumulators driving weighted-random selection. Uses only
# `std` and `anyhow`, so opting out shrinks the public API surface and
# compile time, not the dependency graph.
rating = []
# The rotator (`rotator` module): weighted-random rotation with a bounded
# per-target sticky cache, driven by the rating model. Implies `rating`.
rotator = ["rating"]
# Today's behaviour for anyone who does not opt out.
default = ["pool", "tls", "serde", "rating", "rotator", "secure-auth"]
# Test-only instrumentation for cross-crate test observability: exposes
# the rotator's `pick_order_calls()` diagnostic counter. The counter
# lives inside the rotator, so the feature implies `rotator`. Dependents
# enable it from their `[dev-dependencies]` (cargo turns dev-dep
# features on automatically for their `cargo test` builds); it is NOT
# a default feature, so ordinary release builds compile the counter
# to nothing.
test-instrumentation = ["rotator"]
# Password authentication that never puts the password on the wire: SOCKS5
# method 0x80, a mutual HMAC-SHA256 challenge-response keyed by an Argon2id-derived
# key (`secure_auth`). The server stores the derived key (not the password); the
# client derives it from the password and proves knowledge of it.
secure-auth = [
    "dep:argon2",
    "dep:hmac",
    "dep:hkdf",
    "dep:sha2",
    "dep:subtle",
    "dep:getrandom",
    "dep:zeroize",
    "dep:x25519-dalek",
    "dep:chacha20poly1305",
]
# GSSAPI authentication for SOCKS5 (RFC 1961, method 0x01): the context
# exchange, protection-level negotiation and message protection are
# implemented here over the `gssapi::GssBackend` trait; no password and no
# credential ever crosses the wire. Needs a backend: the test mock ships with
# `test-instrumentation`, a Kerberos one with `gssapi-system`. Implies
# `secure-auth` (the server negotiates between the two strong methods).
gssapi = ["secure-auth"]
# Kerberos 5 through the system GSS-API (MIT Kerberos, Heimdal, Apple GSS) as the
# `gssapi` backend (`gssapi::system::SystemBackend`). Not in the default set:
# it links the platform library and needs its headers and libclang to build.
gssapi-system = ["gssapi", "dep:libgssapi"]
# Wipe secrets from memory when they are dropped: secure-auth credentials, the
# retained user name of `server::IncomingRequest`; adds `ProxyConfig::wipe_credentials`.
# Off by default.
zeroize = ["dep:zeroize"]

# The README-mirrored example rotates through `ProxyRotator` and dials via
# the pool, so it is only built when the rotator and pool are compiled in;
# cargo skips the target
# otherwise, keeping lean `--no-default-features` builds example-clean.
[[example]]
name = "connect_through_proxy"
required-features = ["rotator", "pool"]

# One-connection GSSAPI server the Kerberos CI job points curl at.
[[example]]
name = "gssapi_interop_server"
required-features = ["gssapi-system"]

# Doctests are forbidden in this repository: examples in rustdoc are
# `text` blocks, behaviour is covered by ordinary tests (tests/doc_examples.rs).
# Enforced by .github/scripts/check-no-doctests.sh.
[lib]
doctest = false

[dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
serde = { workspace = true, optional = true }
base64.workspace = true
socket2.workspace = true
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
crossbeam-queue = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
libgssapi = { version = "0.11", optional = true }
argon2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
