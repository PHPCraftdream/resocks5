[package]
name = "resocks5"
description = "SOCKS5 + HTTP CONNECT proxy with upstream rotation, per-target proxy caching, a sand-rating soft-weight rotator, and TLS fragmentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["socks5", "proxy", "http-connect", "tokio", "networking"]
categories = ["network-programming", "command-line-utilities"]
# The binary ships via the GitHub Release and the container image only.
publish = false

[dependencies]
# `version` is what a registry build would resolve from crates.io (`path` is
# only for the local workspace build); the crate is `publish = false`, so
# it is kept in step with `[workspace.package].version` in case publishing
# is ever re-enabled. Not covered by workspace inheritance.
resocks5-net = { path = "../resocks5-net", version = "0.3.0", features = ["pool", "tls", "serde", "rating", "rotator"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs", "signal"] }
anyhow.workspace = true
serde.workspace = true
base64.workspace = true
tokio-rustls.workspace = true
dashmap.workspace = true
chrono.workspace = true
regex.workspace = true
getrandom.workspace = true
sha2.workspace = true
subtle.workspace = true
argon2.workspace = true
hmac.workspace = true
clap.workspace = true
rpassword.workspace = true
ktav.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Client send-buffer shrink in the gate slow-drain tests (same recipe
# as the resocks5-net TLS tests).
socket2.workspace = true
# Rotator test instrumentation for this crate's own test binary.
# Cargo enables dev-dependency features automatically for `cargo test`
# (debug and release alike) and never for ordinary non-test builds.
resocks5-net = { path = "../resocks5-net", features = ["test-instrumentation"] }
